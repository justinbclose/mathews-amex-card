.item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}

.info{min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}

.check{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-content:center;padding:0}
.check svg{width:20px;height:20px;stroke:transparent;fill:none;stroke-width:3}

.detail{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px;border-top:1px solid var(--line);padding-top:12px}

.strip button.cur{border-color:var(--accent)}

.perk-row{display:grid;grid-template-columns:1fr auto;column-gap:12px;padding:14px 16px;width:100%}

.updated span{font-size:12px}
.news{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.news h3{font-family:var(--display);font-size:17px;margin:0;text-wrap:balance}
.news p{font-size:14px}
.news .impact{background:var(--accent-soft);border-radius:10px;padding:8px 10px}
.news-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.news-date{font-size:12px;color:var(--muted)}

.plist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.setup-item{display:grid;grid-template-columns:1fr 44px;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.setup-item:last-child{border-bottom:0}

function pkey(c,i){return c.g==='x'?'x-'+(state.dates[c.id]||'none'):c.g==='m'?Y+'-m'+i:c.g==='q'?Y+'-q'+i:c.g==='h'?Y+'-h'+i:Y+'-y'}
function cur(c){return c.g==='m'?M:c.g==='q'?Math.floor(M/3):c.g==='h'?Math.floor(M/6):0}
function hasEnd(c){return c.g!=='x'||!!pDate(state.dates[c.id])}
function periods(c){
  if(c.g==='x')return [{i:0,label:'',amt:c.per}];
  if(c.g==='m')return MON.map(function(m,i){return {i:i,label:m,amt:(i===11&&c.dec)?c.dec:c.per}});
  if(c.g==='q')return [0,1,2,3].map(function(i){return {i:i,label:'Q'+(i+1),amt:c.per}});
  if(c.g==='h')return [{i:0,label:'Jan–Jun',amt:c.per},{i:1,label:'Jul–Dec',amt:c.per}];
  return [{i:0,label:String(Y),amt:c.per}];
}
function endOf(c){var i=cur(c);if(c.g==='x')return pDate(state.dates[c.id]);return c.g==='m'?new Date(Y,M+1,0):c.g==='q'?new Date(Y,(i+1)*3,0):c.g==='h'?new Date(Y,(i+1)*6,0):new Date(Y,11,31)}

function esc(s){return String(s).replace(/[&<>"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]})}

// ---- Amex News hub ----
var TAGS={new:['New','ok'],changing:['Changing','soon'],ending:['Ending','hot'],rumor:['Rumor','info'],tip:['Tip','info']};
function newsItem(n){
  var t=TAGS[n.tag]||TAGS.tip, wd=pDate(n.when), wl=wd?Math.round((wd-TODAY)/86400000):null;
  var whenTxt=wd?(wl>0?'Takes effect '+fmtDate(wd)+', '+wd.getFullYear()+' · in '+wl+' day'+(wl===1?'':'s'):wl===0?'Takes effect today':'Took effect '+fmtDate(wd)+', '+wd.getFullYear()):'';
  return '<article class="item news"><div class="news-head"><span class="pill '+t[1]+'">'+t[0]+'</span>'+(n.date?'<span class="news-date">'+fmtDate(pDate(n.date)||TODAY)+'</span>':'')+(n.added&&n.added>lastSeenAtOpen?'<span class="pill fresh">Fresh</span>':'')+'</div>'+
    '<h3>'+esc(n.title||'')+'</h3>'+(n.summary?'<p>'+esc(n.summary)+'</p>':'')+
    (n.impact?'<p class="impact"><strong>For you:</strong> '+esc(n.impact)+'</p>':'')+
    (whenTxt?'<p class="tip">'+whenTxt+'</p>':'')+
    (n.url&&/^https:\/\//.test(n.url)?'<div class="links"><a href="'+esc(n.url)+'" target="_blank" rel="noopener">'+esc(n.source||'Source')+' ↗</a></div>':'')+'</article>';
}
function newsHTML(){
  var s='<div class="news-top"><h1>'+esc(CARDS[CARD].name)+' News</h1>'+refreshBtnHTML()+'</div>'+updatedHTML();
  if(refreshMsg)s+='<p class="status">'+esc(refreshMsg)+'</p>';
  if(newsState==='loading'&&!newsItems)return s+'<p class="empty">Loading today’s briefing…</p>';
  if(newsState==='off')return s+'<p class="empty">News can’t load in this view. Open the tracker from its link to see it.</p>';
  if(newsState==='slow'&&!newsItems)return s+'<p class="empty">Can’t reach the news right now. Check your connection.</p>';
  if(brief&&(brief.headline||brief.summary))s+='<div class="card brief"><span class="label">Today’s briefing</span><h2>'+esc(brief.headline||'')+'</h2>'+(brief.summary?'<p>'+esc(brief.summary)+'</p>':'')+'</div>';
  var items=(newsItems||[]).filter(function(n){return (n.card||'plat')===CARD});
  var upcoming=items.filter(function(n){var d=pDate(n.when);return d&&d>=TODAY}).sort(function(a,b){return pDate(a.when)-pDate(b.when)});
  if(upcoming.length)s+='<div class="group"><div class="group-head"><h2>Coming up</h2><span>dates to know</span></div><div class="item">'+upcoming.map(function(n){var d=pDate(n.when),dl=Math.round((d-TODAY)/86400000);return '<div class="setup-item"><div><strong>'+esc(n.title)+'</strong><small>'+fmtDate(d)+', '+d.getFullYear()+'</small></div><div class="days '+(dl<=31?'soon':'')+'" style="width:52px"><b class="num">'+dl+'</b><small>days</small></div></div>'}).join('')+'</div></div>';
  if(items.length)s+='<div class="group"><div class="group-head"><h2>Latest</h2><span>'+items.length+' stories</span></div>'+items.map(newsItem).join('')+'</div>';
  else s+='<p class="empty">No news yet. The first briefing arrives tomorrow morning.</p>';
  s+='<div class="links"><a href="https://www.americanexpress.com/en-us/benefits/offers/" target="_blank" rel="noopener">Open my Amex Offers ↗</a></div>';
  if(newsState==='slow')s+='<p class="save">Showing saved news. It may be out of date.</p>';
  return s;
}

// ---- Refresh now + last updated ----
var TRIGGER='trig_01955BzANdnZAQUWBznpi7VS', mcpApi=null, refreshing=false, refreshAt=0, refreshMsg='', refreshTimer=null;
function ago(ms){var m=Math.round(ms/60000);if(m<1)return 'just now';if(m<60)return m+' min ago';var h=Math.round(m/60);if(h<24)return h+' hr'+(h===1?'':'s')+' ago';var d=Math.round(h/24);return d+' day'+(d===1?'':'s')+' ago'}
function updatedHTML(){
  if(!brief||!brief.updated)return '<p class="updated">Last updated: not yet</p>';
  var u=new Date(brief.updated);
  return '<p class="updated">Last updated '+MON[u.getMonth()]+' '+u.getDate()+' at '+u.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+' · '+ago(Date.now()-u.getTime())+'<br><span>Checks automatically every morning</span></p>';
}
function refreshBtnHTML(){
  if(!mcpApi)return '';
  return '<button type="button" class="refresh'+(refreshing?' spinning':'')+'" data-refresh="1"'+(refreshing?' disabled':'')+'><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>'+(refreshing?'Checking…':'Refresh')+'</button>';
}
function doRefresh(){
  if(!mcpApi||refreshing)return;
  refreshing=true;refreshAt=Date.now();refreshMsg='Started a fresh check of news, credits and perks. It takes a few minutes; this page updates by itself when it finishes.';render();
  mcpApi.callTool('Claude Code Remote','fire_trigger',{trigger_id:TRIGGER,text:'Manual refresh requested from the app just now. Run every step.'},{cache:false}).then(function(){
    clearTimeout(refreshTimer);
    refreshTimer=setTimeout(function(){if(refreshing){refreshing=false;refreshMsg='Still working. Check back in a few minutes; results appear here automatically.';render()}},15*60000);
  }).catch(function(e){
    refreshing=false;var c=e&&e.code;
    if(c==='needs_reauth')refreshMsg='Reconnect Claude Code Remote in claude.ai Settings → Connectors, then try again.';
    else if(c==='server_not_connected'||c==='selection_required')refreshMsg='Refresh needs the Claude Code Remote connector. Add it in claude.ai Settings → Connectors.';
    else if(c==='not_in_manifest'||c==='approval_required'||c==='consent_required')refreshMsg='Refresh needs your OK. Tap Refresh again and choose Allow.';
    else if(c==='blocked_by_policy')refreshMsg='Your account settings block starting the check from here.';
    else if(c==='not_granted'||c==='capability_disabled'||c==='capability_removed'){mcpApi=null;refreshMsg='Refresh isn’t available in this view. Open the tracker from its link.'}
    else if(c==='server_unavailable'||c==='upstream_error')refreshMsg='Couldn’t confirm the check started. Wait a minute before trying again so it doesn’t run twice.';
    else if(c==='tool_error')refreshMsg='The check couldn’t start: '+(e.message||'unknown reason');
    else refreshMsg='Couldn’t start the check. Try again in a minute.';
    render();
  });
}
function briefArrived(){
  if(refreshing&&brief&&brief.updated&&new Date(brief.updated).getTime()>refreshAt-60000){refreshing=false;clearTimeout(refreshTimer);refreshMsg='Done. Everything is up to date.'}
}

function oDays(o){var d=pDate(o.exp);return d?Math.round((d-TODAY)/86400000):null}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function offerItem(o){

    '<button type="button" class="linkbtn" data-odel="'+o.id+'">Remove</button></div>'+
    '<button type="button" class="check" data-oused="'+o.id+'" aria-pressed="'+!!o.used+'" aria-label="Mark '+esc(o.m)+' offer used">'+CHECK+'</button></div></div>';

function offersHTML(){

  s+='<div class="card import"><h2>Add your offers</h2>';
  if(sampleFn){
    s+='<ol><li>In the Amex app, open <strong>Offers</strong> → <strong>Added to Card</strong>.</li><li>Take screenshots of the list.</li><li>Pick them below. The dates and deals fill in for you.</li></ol>';
    if(imgMax)s+='<label class="bigbtn" for="oShots">Add from screenshots</label><input type="file" id="oShots" accept="image/png,image/jpeg,image/webp" multiple hidden>';

  }
  s+='<details'+(sampleFn?'':' open')+'><summary>Add one by hand</summary><div class="form"><label for="oM">Store</label><input id="oM" placeholder="Bose"><label for="oD">Deal</label><input id="oD" placeholder="Spend $200, get $40 back"><label for="oE">Expires</label><input id="oE" type="date"><button type="button" class="bigbtn" data-oadd="1">Add offer</button></div></details>';
  if(busy)s+='<p class="status">'+esc(busy)+'</p>';
  if(oMsg)s+='<p class="status">'+esc(oMsg)+'</p>';
  s+='</div>';
  if(!all.length)s+='<p class="empty">No offers yet. Add your first batch from a screenshot above.</p>';
  if(live.length)s+='<div class="group"><div class="group-head"><h2>Active</h2><span>'+live.length+' offer'+(live.length===1?'':'s')+'</span></div>'+live.map(offerItem).join('')+'</div>';
  if(used.length)s+='<div class="group"><div class="group-head"><h2>Used</h2><span>'+used.length+'</span></div>'+used.map(offerItem).join('')+'</div>';
  if(expired.length)s+='<div class="card"><p>'+expired.length+' offer'+(expired.length===1?' has':'s have')+' expired.</p><button type="button" class="bigbtn ghost" data-oclear="1">Clear expired and used</button></div>';
  return s;
}
function addOffers(list){
  var n=0;
  (list||[]).forEach(function(x){
    if(!x||!x.merchant)return;
    var m=String(x.merchant).trim().slice(0,60), d=String(x.deal||'').trim().slice(0,120), e=/^\d{4}-\d{2}-\d{2}$/.test(x.expires||'')?x.expires:'';
    var dup=state.offers.filter(function(o){return o.m.toLowerCase()===m.toLowerCase()&&o.d.toLowerCase()===d.toLowerCase()})[0];
    if(dup){if(e&&!dup.exp)dup.exp=e;return}
    state.offers.push({id:'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),m:m,d:d,exp:e,used:false});n++;
  });
  return n;
}
var OPROMPT=function(){return 'These are from the "Amex Offers" section of an American Express cardmember’s account. Today is '+iso(TODAY)+'. List every distinct offer shown. Reply with only a JSON array, one object per offer: {"merchant": string, "deal": string (short, like "Spend $50+, get $10 back" or "Earn +3 points per dollar"), "expires": "YYYY-MM-DD" or "" if no date is shown}. If a date has no year, use the next time that date occurs on or after today. Skip anything that is not an offer. Example: [{"merchant":"Bose","deal":"Spend $200+, get $40 back","expires":"2026-12-31"}]'};
function runSample(input,opts){
  busy='Reading your offers…';oMsg='';render();
  sampleFn.json(input,opts).then(function(r){
    var n=addOffers(Array.isArray(r)?r:[]);busy='';
    oMsg=n?'Added '+n+' offer'+(n===1?'':'s')+'. Check the dates against the Amex app.':'No new offers found. Try a clearer screenshot or add one by hand.';
    if(n)changed();else render();
  }).catch(function(e){
    busy='';var c=e&&e.code;
    if(c==='not_granted'||c==='sampling_disabled'||c==='capability_disabled'||c==='not_declared'){sampleFn=null;oMsg='Reading screenshots is turned off for this page. You can still add offers by hand.'}
    else if(c==='images_unavailable'){imgMax=0;oMsg='Screenshots can’t be read here. Try pasting the text instead.'}
    else if(c==='image_rejected')oMsg='That image couldn’t be read. Try a PNG or JPG screenshot.';
    else if(c==='rate_limited')oMsg='Too many tries right now. Wait a few minutes and try again.';
    else if(c==='cancelled')oMsg='';
    else oMsg='Something went wrong reading those offers. Try again.';
    render();
  });
}

var saveText='Saved on this phone';
function setSave(t){saveText=t;var el=document.getElementById('saveMsg');if(el)el.textContent=t}
var art=null,timer=null;
function changed(){
  state.t=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
  render();
  if(art){setSave('Saving…');clearTimeout(timer);timer=setTimeout(publish,1200)}
}
var SKEL='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>';
function buildDoc(){
  var js=JSON.stringify(state).replace(/</g,'\\u003c');
  return SKEL+'<title>Shared Platinum Tracker</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+
   '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">\n'+
   '<style id="pstyle">'+SRC_STYLE+'</style>\n<script type="application/json" id="pstate">'+js+'<\/script>\n'+
   '<div id="app" class="app"><p class="empty">Loading…</p></div>\n<nav class="tabs" id="tabs"></nav>\n<script id="pmain">'+SRC_MAIN+'<\/script></body></html>';
}
function publish(){
  if(!art)return;
  art.publish(buildDoc()).then(function(){setSave('Saved')}).catch(function(e){
    var code=e&&e.code;
    if(code==='conflict')setSave('Updated from another device');
    else if(code==='not_granted'||code==='not_writer'){art=null;setSave('Saved on this phone')}
    else setSave('Saved on this phone');
  });
}
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('button');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;try{localStorage.setItem(LS+'-tab',tab)}catch(err){}render();window.scrollTo(0,0);return}
  if(t.dataset.open){open[t.dataset.open]=!open[t.dataset.open];render();return}
  if(t.dataset.setup){var k=t.dataset.setup;if(state.setup[k])delete state.setup[k];else state.setup[k]=true;changed();return}
  if(t.dataset.refresh){doRefresh();return}
  if(t.dataset.card){setCard(t.dataset.card);open={};render();window.scrollTo(0,0);return}
  if(t.dataset.savedate){var el=document.getElementById('dt-'+t.dataset.savedate),v=el&&el.value||'';if(v)state.dates[t.dataset.savedate]=v;else delete state.dates[t.dataset.savedate];changed();return}
  if(t.dataset.oused){state.offers.forEach(function(o){if(o.id===t.dataset.oused)o.used=!o.used});changed();return}
  if(t.dataset.odel){state.offers=state.offers.filter(function(o){return o.id!==t.dataset.odel});changed();return}
  if(t.dataset.oclear){state.offers=state.offers.filter(function(o){var d=oDays(o);return !o.used&&!(d!==null&&d<0)});oMsg='';changed();return}
  if(t.dataset.oadd){
    var m=(document.getElementById('oM').value||'').trim(), dd=(document.getElementById('oD').value||'').trim(), ex=document.getElementById('oE').value||'';
    if(!m){oMsg='Enter the store name first.';render();return}
    var n=addOffers([{merchant:m,deal:dd,expires:ex}]);oMsg=n?'Added '+m+'.':'That offer is already on your list.';changed();return
  }
  if(t.dataset.oread){
    var txt=(document.getElementById('oText').value||'').trim();
    if(!txt){oMsg='Paste some offer text first.';render();return}
    if(sampleFn&&!busy)runSample(OPROMPT()+'\n\nOffer text:\n'+txt.slice(0,20000),{});
    return
  }
  if(t.dataset.c){
    var c=CREDITS.filter(function(x){return x.id===t.dataset.c})[0];if(!c)return;
    var key=pkey(c,+t.dataset.i);state.checks[c.id]=state.checks[c.id]||{};
    if(state.checks[c.id][key])delete state.checks[c.id][key];else state.checks[c.id][key]=true;
    if(navigator.vibrate){try{navigator.vibrate(10)}catch(err){}}
    changed();
  }
});
document.addEventListener('change',function(e){
  if(e.target.id!=='oShots'||!e.target.files||!e.target.files.length||!sampleFn||busy)return;
  var files=Array.prototype.slice.call(e.target.files,0,imgMax||1);
  runSample(OPROMPT()+(e.target.files.length>files.length?'':''),{images:files});
});
render();
if(window.claude&&window.claude.use){
  window.claude.use('artifact').then(function(a){if(a){art=a;setSave('Saved to your account')}}).catch(function(){});
  
}
(function(){try{var P=JSON.parse(document.getElementById('pnews').textContent);newsItems=(P.news||[]).slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'')});var A=P.alerts||{},a={};Object.keys(A).forEach(function(k){if(A[k]&&A[k].active!==false)a[k]=A[k]});alerts=a;brief=P.brief||null;newsState='ok'}catch(e){newsState='off'}render()})();
})();
</script>
</body></html>
