<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><meta name="apple-mobile-web-app-title" content="Mathew’s Amex"><meta name="theme-color" content="#EBEEF2" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#06080C" media="(prefers-color-scheme: dark)"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="apple-touch-icon.png"></head><body><title>Mathew’s Amex Card</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600..800&family=Manrope:wght@400..800&family=Martian+Mono:wght@400..700&display=swap">
<style id="pstyle">
/* "Brushed Platinum": the metal card is the hero, everything else is a calm concierge desk. */
:root{
  --bg:#EBEEF2; --card:#FFFFFF; --surface-2:#F5F6F8; --line:#DDE1E7; --fg:#0D1B2E; --muted:#5A6576;
  --accent:#1F4FB0; --accent-2:#1FA89C; --on-accent:#FFFFFF; --accent-soft:#E2EAFB;
  --ok:#13795A; --ok-soft:#DDF5EA; --hot:#C8371F; --hot-soft:#FDE4DC; --soon:#9A6100; --soon-soft:#FFF1C4;
  --cobalto:#1F4FB0; --turquesa:#22B1A4; --limon:#F2C230; --flamboyan:#E2462B; --coral:#F28A5B; --rosa:#E0559A; --adoquin:#4A7590;
  --display:"Bodoni Moda",Didot,Georgia,serif; --body:"Manrope",system-ui,sans-serif; --mono:"Martian Mono",ui-monospace,Menlo,monospace;
  --r-lg:22px; --r-md:16px; --r-sm:11px; --ease:cubic-bezier(.2,.8,.2,1);
  --shadow:0 1px 2px rgba(13,27,46,.05),0 6px 20px rgba(13,27,46,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#06080C; --card:#11151C; --surface-2:#171C25; --line:#242B36; --fg:#EDF0F5; --muted:#8D97A6;
  --accent:#8FB4FF; --accent-2:#5FE0D0; --on-accent:#081430; --accent-soft:#17223D;
  --ok:#7FE0B5; --ok-soft:#0F2A20; --hot:#FF8A66; --hot-soft:#3A1810; --soon:#FFD25E; --soon-soft:#352A0C;
  --adoquin:#7FA6BF;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06080C; --card:#11151C; --surface-2:#171C25; --line:#242B36; --fg:#EDF0F5; --muted:#8D97A6;
  --accent:#8FB4FF; --accent-2:#5FE0D0; --on-accent:#081430; --accent-soft:#17223D;
  --ok:#7FE0B5; --ok-soft:#0F2A20; --hot:#FF8A66; --hot-soft:#3A1810; --soon:#FFD25E; --soon-soft:#352A0C;
  --adoquin:#7FA6BF;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:radial-gradient(70% 40% at 0% -6%,color-mix(in srgb,var(--turquesa,#22B1A4) 16%,transparent),transparent 70%),radial-gradient(60% 34% at 100% -4%,color-mix(in srgb,var(--flamboyan,#E2462B) 10%,transparent),transparent 70%),radial-gradient(130% 55% at 50% -12%,color-mix(in srgb,var(--accent) 11%,transparent),transparent 62%),var(--bg);background-repeat:no-repeat;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;min-height:100vh}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(132px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
h1,h2{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:700}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.label{font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---- The metal card ---- */
.hero{--ink:#14202E;position:relative;overflow:hidden;isolation:isolate;color:var(--ink);border-radius:20px;padding:18px 18px 16px;aspect-ratio:1.586;display:flex;flex-direction:column;justify-content:space-between;gap:4px;touch-action:pan-y;
  transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .55s var(--ease);
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.10) 0 1px,rgba(0,0,0,.03) 1px 2px,rgba(255,255,255,0) 2px 3px),
    linear-gradient(118deg,#f3f5f7 0%,#c3cad2 18%,#eef1f4 34%,#a9b2bc 55%,#e3e7eb 72%,#b7bfc8 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(0,0,0,.18),inset 0 0 0 1px rgba(255,255,255,.35),0 22px 44px -18px rgba(8,18,40,.55),0 3px 8px rgba(8,18,40,.12)}
.hero.lit{transition:transform .08s linear}
.hero-sheen{position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 80% at var(--sx,25%) var(--sy,15%),rgba(255,255,255,.75),rgba(255,255,255,0) 60%);mix-blend-mode:soft-light;opacity:.9}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 47%,transparent 58%);transform:translateX(-70%)}
@media (prefers-reduced-motion:no-preference){.hero::after{animation:sheen 7s var(--ease) 1.2s infinite}@keyframes sheen{0%,72%{transform:translateX(-70%)}100%{transform:translateX(70%)}}}
.hero>*{position:relative}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.chip{width:44px;height:33px;border-radius:7px;background:linear-gradient(135deg,#ead49a,#b99652 52%,#ecd9a4);box-shadow:inset 0 0 0 1px rgba(90,70,30,.35),0 1px 0 rgba(255,255,255,.6);position:relative}
.chip::before{content:"";position:absolute;inset:8px 0;border-top:1px solid rgba(90,70,30,.4);border-bottom:1px solid rgba(90,70,30,.4)}
.chip::after{content:"";position:absolute;inset:0 15px;border-left:1px solid rgba(90,70,30,.4);border-right:1px solid rgba(90,70,30,.4)}
.card-name{font:600 10.5px var(--mono);letter-spacing:.26em;text-transform:uppercase;color:rgba(20,32,46,.72);text-shadow:0 1px 0 rgba(255,255,255,.75)}
.hero .label{color:rgba(20,32,46,.7);text-shadow:0 1px 0 rgba(255,255,255,.6)}
.hero-main{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero-days{font-family:var(--display);font-weight:800;font-size:72px;line-height:.82;letter-spacing:-.02em;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.hero-days small{font:600 15px var(--body);margin-left:6px;letter-spacing:0}
.hero-what{text-align:right;font-weight:800;font-size:15px;min-width:0}
.hero-what span{display:block;font-weight:500;opacity:.78;font-size:12.5px;line-height:1.3}
.payback{display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.25}
.payback b{font-family:var(--mono);font-size:13px}
.pb-sub{display:block;font-size:11.5px;opacity:.72}
.ring{width:40px;height:40px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring-track{stroke:rgba(20,32,46,.14)}
.ring-fill{stroke:url(#pbg);stroke-linecap:round;transition:stroke-dasharray .6s var(--ease)}
.ring-fill[data-pct="0"]{stroke-opacity:0}
.hero.paid{background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.10) 0 1px,rgba(0,0,0,.03) 1px 2px,rgba(255,255,255,0) 2px 3px),
    linear-gradient(130deg,#e4ecff 0%,#d3f1ec 50%,#e4ecff 100%),
    linear-gradient(118deg,#f3f5f7,#c3cad2 40%,#eef1f4)}
.hero.paid .ring-fill{stroke:#167A4E}
@media (prefers-reduced-motion:no-preference){.hero.celebrate{animation:cheer .9s var(--ease)}@keyframes cheer{30%{transform:perspective(900px) rotateY(-8deg) scale(1.02)}70%{transform:perspective(900px) rotateY(5deg)}}}

/* ---- Lists ---- */
.updated{font-size:12.5px;color:var(--muted);margin-top:-8px;padding:0 4px}
.updated span{font-size:12px}
.group{display:flex;flex-direction:column}
.group-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;column-gap:12px;row-gap:2px;padding:0 4px 8px}
.group-head h2{font-size:21px;display:flex;align-items:center;gap:8px;flex:0 0 auto;max-width:100%}
.group-head span{font:500 10.5px var(--mono);color:var(--muted);letter-spacing:.03em;margin-left:auto}
.g-hot .group-head h2::before,.g-soon .group-head h2::before,.g-later .group-head h2::before,.g-done .group-head h2::before{content:"";width:9px;height:9px;flex:none}
.g-hot .group-head h2::before{background:var(--hot);transform:rotate(45deg);border-radius:1px}
.g-soon .group-head h2::before{background:var(--soon);border-radius:50%}
.g-later .group-head h2::before{background:var(--adoquin);border-radius:2px;transform:skewX(-12deg)}
.g-done .group-head h2::before{background:var(--ok);border-radius:2px}
.item{background:var(--card);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow)}
.group>.item{border-radius:0;box-shadow:none;border-bottom:1px solid var(--line)}
.group>.group-head+.item{border-top-left-radius:var(--r-md);border-top-right-radius:var(--r-md)}
.group>.item:last-child{border-bottom:0;border-bottom-left-radius:var(--r-md);border-bottom-right-radius:var(--r-md)}
.group>.item.news{border-radius:var(--r-md);border-bottom:0;margin-bottom:10px;box-shadow:var(--shadow)}
.item-row{display:grid;grid-template-columns:58px 1fr 44px;align-items:center;gap:12px;padding:11px 12px}
.days{height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--accent-soft);color:var(--accent)}
.days b{font:600 19px var(--mono);line-height:1}
.days small{font:700 9px var(--mono);text-transform:uppercase;letter-spacing:.1em}
.days.hot{background:var(--hot-soft);color:var(--hot)}
.days.soon{background:var(--soon-soft);color:var(--soon)}
.days.ok{background:var(--ok-soft);color:var(--ok)}
.info{min-width:0;background:none;border:0;padding:4px 0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.info strong{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.005em}
.info span{display:block;font-size:13px;color:var(--muted)}
.check{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface-2);cursor:pointer;display:grid;place-content:center;padding:0;transition:transform .15s var(--ease)}
.check:active{transform:scale(.9)}
.check svg{width:20px;height:20px;stroke:transparent;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.check[aria-pressed="true"] svg{stroke:var(--card)}
@media (prefers-reduced-motion:no-preference){.check.just{animation:pop .4s var(--ease)}@keyframes pop{40%{transform:scale(1.18)}}}
.item.done .info strong{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.item.alerted{box-shadow:inset 3px 0 0 var(--hot)}
.detail{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;font-size:14px;border-top:1px solid var(--line);background:var(--surface-2)}
.detail .tip,.tip{color:var(--muted);font-size:13px}
.strip{display:flex;gap:6px;flex-wrap:wrap}
.strip button{font:600 10.5px var(--mono);border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;padding:0 8px;min-width:44px;min-height:34px;cursor:pointer}
.strip button.on{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.strip button.cur{border-color:var(--accent);color:var(--accent)}
.perk-row{display:grid;grid-template-columns:1fr auto;column-gap:12px;padding:14px 16px;width:100%;min-height:60px}
.perk-row strong,.perk-row span{grid-column:1}
.perk-row em{grid-column:2;grid-row:1/3;align-self:center;font-style:normal;font-size:22px;color:var(--accent);width:24px;text-align:center}
.plist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.links{display:flex;flex-wrap:wrap;gap:8px;padding-top:2px}
.links a{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;text-decoration:none}
.links a:first-child{background:var(--accent);color:var(--on-accent)}
.links a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bigbtn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;background:var(--accent);color:var(--on-accent);font:700 15px var(--body);border:0;cursor:pointer;width:100%;margin-top:6px}
.bigbtn.ghost{background:var(--accent-soft);color:var(--accent)}
label.bigbtn:focus-within,.bigbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;color:var(--accent);padding:4px 0}
textarea,.form input{width:100%;font:16px var(--body);padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);margin-top:6px}
.form{display:flex;flex-direction:column;gap:2px}
.form label{font-size:13px;font-weight:600;color:var(--muted);margin-top:8px}
.status{font-size:14px;font-weight:600;color:var(--accent);margin-top:6px}
.linkbtn{background:none;border:0;padding:4px 0 0;color:var(--muted);font:600 12px var(--body);text-decoration:underline;cursor:pointer}
.alert{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:12px;border-radius:12px;background:var(--hot-soft);color:var(--fg);font-size:13px}
.alert strong{color:var(--hot);font-size:14px}
.alert p{margin:2px 0 0}
.alert a{color:var(--hot);font-weight:700;font-size:13px;display:inline-block;padding:6px 0}
.alert-when{font-weight:600}
.alert-badge{width:24px;height:24px;border-radius:7px;transform:rotate(45deg) scale(.8);background:var(--hot);color:var(--card);display:grid;place-content:center;font-weight:800}

/* ---- News ---- */
.news-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.refresh{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);font:700 14px var(--body);cursor:pointer}
.refresh svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.refresh[disabled]{opacity:.75;cursor:default}
@media (prefers-reduced-motion:no-preference){.refresh.spinning svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}
.news{padding:16px;display:flex;flex-direction:column;gap:8px}
.news h3{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.2;margin:0;text-wrap:balance}
.news p{font-size:14px}
.news .impact{background:var(--accent-soft);border-radius:12px;padding:9px 12px}
.news-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.news-date{font:500 11px var(--mono);color:var(--muted)}
.pill{font:700 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.soon{background:var(--soon-soft);color:var(--soon)}.pill.hot{background:var(--hot-soft);color:var(--hot)}
.pill.fresh{background:var(--turquesa,#22B1A4);color:#04201D}
.card{background:var(--card);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.card h2{font-size:19px}
.card ul,.card ol{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.card.brief{position:relative;overflow:hidden;background:linear-gradient(150deg,#0F2C6B,#1F4FB0 52%,#168C93);color:#F2F5FB;box-shadow:0 18px 36px -18px rgba(15,44,107,.7)}
.card.brief .label{color:rgba(242,245,251,.7)}
.card.brief h2{font-size:23px;line-height:1.15}
.card.brief p{color:rgba(242,245,251,.9)}
.setup-item{display:grid;grid-template-columns:1fr 52px;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);min-height:62px}
.setup-item:last-child{border-bottom:0}
.setup-item strong{font-weight:700}
.setup-item small{display:block;color:var(--muted);font-size:13px}
.setup-item.done strong{color:var(--muted);text-decoration:line-through}
.srow{border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .setup-item{border-bottom:0;grid-template-columns:1fr 44px 44px;gap:8px}
.srow .detail{border-top:1px dashed var(--line)}
.more{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-content:center;cursor:pointer;padding:0}
.more svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease)}
.more[aria-expanded="true"]{color:var(--accent);background:var(--accent-soft)}
.more[aria-expanded="true"] svg{transform:rotate(180deg)}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:-6px}
.meter i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#1F4FB0,#22B1A4);transition:width .5s var(--ease)}
.empty{text-align:center;color:var(--muted);padding:24px 0}
.save{font:500 11px var(--mono);color:var(--muted);text-align:center;letter-spacing:.04em}

/* ---- Floating tab bar ---- */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:496px;margin:0 auto;border-radius:28px;padding:6px;z-index:5;
  background:color-mix(in srgb,var(--card) 84%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);
  border:1px solid color-mix(in srgb,var(--line) 80%,transparent);box-shadow:0 14px 34px -10px rgba(8,18,40,.32)}
.tabs-in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{background:none;border:0;min-height:58px;padding:8px 4px;font:700 12px var(--body);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;position:relative;border-radius:22px;transition:background-color .2s var(--ease),color .2s var(--ease)}
.tab svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.tab .dot{position:absolute;top:5px;left:calc(50% + 7px);min-width:18px;height:18px;border-radius:9px;background:var(--hot);color:#fff;font:700 10px var(--mono);display:grid;place-content:center;padding:0 4px;box-shadow:0 0 0 2px var(--card)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---- Coin that floats up when a credit is used ---- */
.coin{position:fixed;z-index:60;pointer-events:none;font:700 13px var(--mono);color:#3D2600;background:linear-gradient(135deg,#FFE58A,#F2C230 55%,#F28A5B);padding:5px 10px;border-radius:999px;box-shadow:0 6px 16px -6px rgba(10,60,30,.5);transform:translate(-50%,0);animation:coin .95s var(--ease) forwards}
@keyframes coin{0%{opacity:0;transform:translate(-50%,8px) scale(.8)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.05)}100%{opacity:0;transform:translate(-50%,-56px) scale(1)}}

 {tab:null,title:'Put it on your home screen',body:'<p>In Safari, tap <strong>Share</strong>, then <strong>Add to Home Screen</strong>. It opens like an app.</p><p style="color:var(--muted);font-size:13px">Your checkmarks are saved on this phone only. No account or login.</p>',last:true}
];
var i=0, back;
function goTab(t){var b=document.querySelector('.tab[data-tab="'+t+'"]');if(b)b.click()}
function hi(t){Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){b.classList.toggle('tour-hi',!!t&&b.dataset.tab===t)})}
function done(toSetup){
  try{localStorage.setItem(KEY,String(Date.now()))}catch(e){}
  document.body.classList.remove('touring');hi(null);
  if(back)back.remove();
  goTab(toSetup?'setup':'due');
}
function show(){
  var s=STEPS[i];
  if(s.tab)goTab(s.tab);
  hi(s.tab);
  back.innerHTML='<div class="tour-card'+(s.tab?'':' center')+'" role="dialog" aria-modal="true" aria-labelledby="tourT">'+
    '<span class="tour-step">'+(i+1)+' of '+STEPS.length+'</span><h2 id="tourT">'+s.title+'</h2>'+s.body+
    '<div class="tour-nav">'+(s.last?'<span></span>':'<button type="button" class="tour-skip" data-tour="skip">Skip</button>')+
    '<div class="tour-dots" aria-hidden="true">'+STEPS.map(function(_,k){return '<i'+(k===i?' class="on"':'')+'></i>'}).join('')+'</div>'+
    '<button type="button" class="tour-next" data-tour="next">'+(s.last?'Start with Setup':(i===0?'Show me':'Next'))+'</button></div></div>';
  var n=back.querySelector('.tour-next');if(n)n.focus();
}
function start(){
  if(!document.querySelector('.tab'))return setTimeout(start,100);
  back=document.createElement('div');back.className='tour-back';
  back.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button[data-tour]');if(!b)return;
    e.stopPropagation();
    if(b.dataset.tour==='skip')return done(false);
    if(STEPS[i].last)return done(true);
    i++;show();
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.body.classList.contains('touring'))done(false)});
  document.body.appendChild(back);document.body.classList.add('touring');show();
}
start();
})();
</script>
<script id="pfx">
/* Brushed Platinum motion: card tilt + sheen, payback ring animation, "+$" coin on check-off. */
(function(){
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var lastPct=null;
function ring(){
  var f=document.querySelector('.ring-fill');if(!f)return;
  var p=+f.dataset.pct||0;
  if(lastPct!==null&&lastPct!==p&&!reduce){
    f.style.transition='none';f.style.strokeDasharray=lastPct+' 100';f.getBoundingClientRect();
    f.style.transition='';f.style.strokeDasharray=p+' 100';
    if(p>=100&&lastPct<100){var h=document.querySelector('.hero');if(h){h.classList.add('celebrate');setTimeout(function(){h.classList.remove('celebrate')},1000)}}
  }
  lastPct=p;
}
var app=document.getElementById('app');
if(app&&window.MutationObserver)new MutationObserver(ring).observe(app,{childList:true});
ring();
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('button.check[data-c]');if(!t)return;
  var b=document.querySelector('.item-row button.check[data-c="'+t.dataset.c+'"]');
  if(!b||b.getAttribute('aria-pressed')!=='true')return;
  b.classList.add('just');
  if(reduce)return;
  var row=b.closest('.item-row'),s=row&&row.querySelector('.info span'),m=s&&/\$[\d,]+(\.\d+)?/.exec(s.textContent);
  if(!m)return;
  var r=b.getBoundingClientRect(),c=document.createElement('div');
  c.className='coin';c.textContent='+'+m[0];c.style.left=(r.left+r.width/2)+'px';c.style.top=(r.top-6)+'px';
  document.body.appendChild(c);setTimeout(function(){c.remove()},1000);
});
if(reduce)return;
function tilt(e){
  var h=e.target.closest&&e.target.closest('.hero');if(!h)return;
  var r=h.getBoundingClientRect(),x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
  h.classList.add('lit');
  h.style.setProperty('--ry',((x-.5)*12).toFixed(2)+'deg');h.style.setProperty('--rx',((.5-y)*9).toFixed(2)+'deg');
  h.style.setProperty('--sx',(x*100).toFixed(1)+'%');h.style.setProperty('--sy',(y*100).toFixed(1)+'%');
}
function rest(h){if(!h)return;h.classList.remove('lit');['--rx','--ry'].forEach(function(k){h.style.removeProperty(k)})}
document.addEventListener('pointermove',tilt,{passive:true});
document.addEventListener('pointerdown',tilt,{passive:true});
document.addEventListener('pointerout',function(e){var h=e.target.closest&&e.target.closest('.hero');if(h&&!(e.relatedTarget&&h.contains(e.relatedTarget)))rest(h)});
['pointerup','pointercancel'].forEach(function(ev){document.addEventListener(ev,function(e){if(e.pointerType!=='mouse')rest(e.target.closest&&e.target.closest('.hero'))})});
})();
</script>
